name: Release

on:
  workflow_dispatch:
    inputs:
      upgrade:
        description: Version action (patch, minor, major, or publish existing without bumping)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - existing

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Bump and push version
        if: inputs.upgrade != 'existing'
        run: |-
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version ${{ inputs.upgrade }} --message "chore: release %s"
          git push --follow-tags

      - run: pnpm publish --provenance
